name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Verify build
        run: go build -v ./...

      - name: Run Go tests with Race Detection and Coverage
        run: go test -v -race -cover ./...
